# CI 標準テンプレート(masatomix/task#1055 Phase 1 / #1071)。
# Gradle ビルド + テスト。コンパイル対象は build.gradle の Java toolchain(21)で固定される
# ため、ランナーの JDK は Gradle 実行用に 21 を用意する。
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew build
