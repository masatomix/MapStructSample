plugins {
    id 'java'
    // 8.3 が pull する Lombok 1.18.30 は新しい JDK で javac の NoSuchFieldError を
    // 起こすため、JDK 21 互換の Lombok を pull する版へ更新（task#1071 ビルド修復）。
    id "io.freefair.lombok" version "8.14.4"
    id 'org.springframework.boot' version '3.0.6'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.example'
version = '0.0.3-SNAPSHOT'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    // // === Lombok追加 ===
    // compileOnly 'org.projectlombok:lombok:1.18.30'
    // annotationProcessor 'org.projectlombok:lombok:1.18.30'

    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    
}

// Java toolchain を明示し、環境依存(システム既定 JDK)を排除する（task#1071）。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// spring-boot-starter-test は JUnit 5(Jupiter)。明示しないと Jupiter テストが
// 検出されず 0 件実行になる（task#1071）。
tasks.named('test') {
    useJUnitPlatform()
}


